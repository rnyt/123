[project]
name = "grades-bot"
version = "1.0.0"
description = "Telegram-бот: средний балл, ОКР, лабораторные/практические и аттестация"
requires-python = ">=3.10,<3.15"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "I"]
ignore = ["E501", "SIM108", "SIM105"]
